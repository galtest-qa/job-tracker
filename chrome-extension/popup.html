<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px; padding: 16px; background: #f8f9fb; color: #1a1d23;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 {
      font-size: 16px; font-weight: 800;
      background: linear-gradient(135deg, #4f6ef7, #7c5ce7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 11px; color: #6b7280; margin-top: 4px; }
    .status {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      margin-bottom: 12px;
    }
    .status-ok { background: #d1fae5; color: #065f46; }
    .status-disconnected { background: #fee2e2; color: #dc2626; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-ok .dot { background: #10b981; }
    .status-disconnected .dot { background: #ef4444; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; }
    .form-group textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #e2e5ea; border-radius: 6px;
      font-size: 12px; font-family: monospace; outline: none; resize: vertical; min-height: 60px;
    }
    .form-group textarea:focus { border-color: #4f6ef7; }
    .btn {
      width: 100%; padding: 9px; border-radius: 8px; font-size: 13px;
      font-weight: 600; border: none; cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: #4f6ef7; color: white; }
    .btn-primary:hover { background: #3b5de7; }
    .btn-primary:disabled { opacity: 0.5; }
    .btn-ghost { background: none; color: #6b7280; margin-top: 8px; font-size: 12px; }
    .error { color: #dc2626; font-size: 12px; margin-bottom: 8px; padding: 8px; background: #fef2f2; border-radius: 6px; }
    .hint { font-size: 11px; color: #9ca3af; margin-top: 10px; line-height: 1.5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Job Tracker</h1>
    <p>Save jobs from LinkedIn with one click</p>
  </div>

  <div id="view-connected" class="hidden">
    <div class="status status-ok">
      <span class="dot"></span>
      <span>Connected <span id="user-email" style="font-weight:400; opacity:0.7"></span></span>
    </div>
    <p class="hint" style="text-align:center">Browse LinkedIn jobs and click the blue "Save to Tracker" button to save them.</p>
    <button id="disconnect-btn" class="btn btn-ghost">Disconnect</button>
  </div>

  <div id="view-disconnected">
    <div class="status status-disconnected">
      <span class="dot"></span>
      <span>Not connected</span>
    </div>
    <div class="form-group">
      <label>Connection Code</label>
      <textarea id="code-input" placeholder="Paste the code from Settings → Chrome Extension → Get Connection Code"></textarea>
    </div>
    <div id="error" class="error hidden"></div>
    <button id="connect-btn" class="btn btn-primary">Connect</button>
    <p class="hint">Open Job Tracker → Settings → Chrome Extension → click "Get Connection Code" and paste it above.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
